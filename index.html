<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080c1a">
<title>午夜时分</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap">
<style>
  /* Layout: full-screen night hallway; captions top-left, controls and sheets anchored to the bottom edge. */
  :root {
    --ink: #080c1a;
    --night: #121a35;
    --moon: #d2e4ff;
    --lamp: #ffc07a;
    --mist: #8a9cc8;
    --warn: #ffb35c;
    --display: "ZCOOL XiaoWei", "Songti SC", "Noto Serif SC", "STSong", serif;
    --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--moon);
    font: 15px/1.6 var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .top {
    position: fixed; left: 0; right: 0; top: 0; z-index: 3; display: flex; gap: 8px; justify-content: flex-end;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0;
  }
  .chip {
    font: 500 14px/1 var(--body); color: var(--moon); background: rgba(8, 12, 26, .55);
    border: 1px solid rgba(210, 228, 255, .28); border-radius: 999px; padding: 10px 14px; min-height: 40px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .chip.pulse { border-color: var(--lamp); color: var(--lamp); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(255, 192, 122, .18); } }

  .cap {
    position: fixed; left: 0; right: 0; top: 0; z-index: 2; pointer-events: none;
    padding: calc(64px + env(safe-area-inset-top, 0px)) 20px 0; max-width: 30rem;
    transition: opacity .6s ease;
  }
  .cap.off { opacity: 0; }
  .cap .line { margin: 0; font: 400 clamp(22px, 6.2vw, 30px)/1.35 var(--display); text-wrap: balance; text-shadow: 0 2px 14px rgba(8, 12, 26, .9); }
  .cap .hint { margin: 8px 0 0; font: 500 13px/1.4 var(--body); color: var(--lamp); letter-spacing: .04em; text-shadow: 0 1px 8px rgba(8, 12, 26, .95); }

  .hud {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, rgba(8, 12, 26, .88), rgba(8, 12, 26, 0));
    display: flex; flex-direction: column; gap: 10px;
  }
  .meter { position: relative; height: 10px; border-radius: 6px; background: rgba(210, 228, 255, .14); overflow: visible; }
  .meter .fill { height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, var(--mist), var(--moon)); transition: background .2s; }
  .meter.low .fill { background: linear-gradient(90deg, #b37a3a, var(--warn)); }
  .meter .tick { position: absolute; top: -5px; width: 3px; height: 20px; border-radius: 2px; background: var(--lamp); left: 0; }
  .row { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; font-size: 13px; color: var(--mist); }
  .row b { color: var(--moon); font-weight: 500; font-variant-numeric: tabular-nums; }
  #stVol.low { color: var(--warn); font-weight: 700; }
  .row.ctrl { gap: 8px; justify-content: flex-start; }
  .row.ctrl .chip { flex: 1 1 0; min-width: 0; }

  .sheet {
    position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, rgba(8, 12, 26, .97) 45%, rgba(8, 12, 26, .6) 75%, rgba(8, 12, 26, .1));
    overflow-y: auto;
  }
  .sheet > * { max-width: 30rem; width: 100%; }
  .eyebrow { margin: 0; font: 500 12px/1 var(--body); letter-spacing: .18em; color: var(--lamp); }
  h1 { margin: 0; font: 400 clamp(44px, 14vw, 72px)/1.05 var(--display); letter-spacing: .02em; }
  h2 { margin: 0; font: 400 28px/1.2 var(--display); }
  .sub { margin: 0; color: var(--mist); }
  .sub b { color: var(--moon); font-weight: 500; }
  .msg { margin: 0; padding: 10px 12px; border-radius: 10px; background: rgba(255, 179, 92, .12); border: 1px solid rgba(255, 179, 92, .4); color: #ffd9aa; font-size: 14px; }
  .btns { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    font: 700 16px/1 var(--body); min-height: 52px; border-radius: 14px; padding: 0 18px; cursor: pointer;
    color: var(--moon); background: transparent; border: 1px solid rgba(210, 228, 255, .35);
  }
  .btn.primary { background: var(--lamp); color: var(--ink); border-color: var(--lamp); }
  .btn.small { min-height: 44px; font-size: 14px; font-weight: 500; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font-family: inherit; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
  textarea {
    width: 100%; min-height: 22vh; resize: vertical; border-radius: 12px; padding: 12px;
    background: rgba(210, 228, 255, .07); color: var(--moon); border: 1px solid rgba(210, 228, 255, .3);
    font: 500 17px/1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em;
  }
  .kbd { display: flex; flex-direction: column; gap: 8px; }
  .kbd-row { display: grid; gap: 8px; }
  .kbd-row.n7 { grid-template-columns: repeat(7, 1fr); }
  .kbd-row.n6 { grid-template-columns: repeat(6, 1fr); }
  .kbd-row.n3 { grid-template-columns: 1.4fr 1fr 1fr 1.2fr; }
  .kbd button { min-height: 48px; min-width: 0; padding: 0 4px; border-radius: 10px; font: 700 17px/1 var(--body); color: var(--moon); background: rgba(210, 228, 255, .1); border: 1px solid rgba(210, 228, 255, .28); }
  .kbd button:active { background: rgba(255, 192, 122, .3); }
  .kbd .n6 button, .kbd .n3 button { font-size: 14px; font-weight: 500; }
  .bars { display: flex; flex-wrap: wrap; gap: 6px; }
  .bars span { padding: 5px 8px; border-radius: 8px; border: 1px solid rgba(210, 228, 255, .22); font: 500 12px/1.3 var(--body); color: var(--mist); font-variant-numeric: tabular-nums; }
  .bars span b { color: var(--moon); font-weight: 700; }
  .bars span.bad { border-color: var(--warn); color: var(--warn); }
  .bars span.bad b { color: var(--warn); }
  .status { margin: 0; font-size: 13px; color: var(--mist); font-variant-numeric: tabular-nums; }
  .status.ok { color: #9fe0b5; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(110px + env(safe-area-inset-bottom, 0px)); z-index: 9;
    max-width: 88vw; padding: 10px 14px; border-radius: 12px; background: rgba(210, 228, 255, .94); color: var(--ink); font-weight: 500; font-size: 14px;
    transition: opacity .4s; opacity: 0; pointer-events: none;
  }
  .toast.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .chip.pulse { animation: none; } .cap { transition: none; } }
</style>
</head>
<body>


<canvas id="stage" aria-label="午夜走廊的动画画面"></canvas>

<div class="top" id="top">
  <button class="chip pulse" id="btnDone" hidden>完成并保存标准</button>
  <button class="chip" id="btnRestart" hidden>重来</button>
  <button class="chip" id="btnExit" hidden>退出</button>
</div>

<div class="cap off" id="cap"><p class="line" id="capLine"></p><p class="hint" id="capHint"></p></div>

<div class="hud" id="hud" hidden>
  <div class="meter" id="meter"><div class="fill" id="mFill"></div><div class="tick" id="mTick"></div></div>
  <div class="row"><span id="stBar">第 <b>1</b> / 18 小节</span><span id="stNote">听到 <b>—</b></span><span id="stVol">音量</span></div>
  <div class="row ctrl"><button class="chip" id="barPrev">◀ 上一小节</button><button class="chip" id="barNext">下一小节 ▶</button></div>
</div>

<section class="sheet" id="menu">
  <p class="eyebrow">钢琴练习伴侣</p>
  <h1>午夜时分</h1>
  <p class="sub">手机放在琴谱架上，点开始，弹给手机听。画面会跟着你弹到的地方和力度变化。</p>
  <p class="msg" id="menuMsg" hidden></p>
  <p class="status" id="scoreStatus"></p>
  <p class="status" id="stdStatus"></p>
  <div class="btns">
    <button class="btn primary" id="btnStart">开始演奏</button>
    <div class="split">
      <button class="btn small" id="btnDemo">看一遍画面</button>
      <button class="btn small" id="btnScore">乐谱设置</button>
    </div>
    <button class="btn small" id="btnStd">记录标准音量</button>
  </div>
</section>

<section class="sheet" id="scoreSheet" hidden>
  <h2>乐谱设置</h2>
  <p class="sub">照着谱上铅笔写的音名，用下面的按键按顺序点。每点完一个小节，点“下一小节”。长音点一下“2 拍”“3 拍”“4 拍”，不点就是 1 拍。没有声音的休止拍点“休止 0”，再点拍数。升号降号点在音后面。只录右手旋律就够了。</p>
  <textarea id="scoreText" spellcheck="false" autocapitalize="characters" inputmode="none" placeholder="例如：C D E C | G:2 G:2 | …"></textarea>
  <div class="kbd" id="kbd">
    <div class="kbd-row n7">
      <button type="button" data-k="C">C</button><button type="button" data-k="D">D</button><button type="button" data-k="E">E</button><button type="button" data-k="F">F</button><button type="button" data-k="G">G</button><button type="button" data-k="A">A</button><button type="button" data-k="B">B</button>
    </div>
    <div class="kbd-row n6">
      <button type="button" data-k="#">升 #</button><button type="button" data-k="b">降 b</button><button type="button" data-k=":2">2 拍</button><button type="button" data-k=":3">3 拍</button><button type="button" data-k=":4">4 拍</button><button type="button" data-k=":0.5">半拍</button>
    </div>
    <div class="kbd-row n3">
      <button type="button" data-k="|">下一小节 |</button><button type="button" data-k="0">休止 0</button><button type="button" data-k="back">退格</button><button type="button" id="kbdSys">手机键盘</button>
    </div>
  </div>
  <p class="status" id="scoreParse"></p>
  <div class="bars" id="barChips" aria-label="每个小节的音数和拍数"></div>
  <div class="split">
    <button class="btn primary" id="scoreSave">保存</button>
    <button class="btn" id="scoreCancel">取消</button>
  </div>
  <button class="btn small" id="scoreClear">清空乐谱</button>
</section>

<section class="sheet" id="endSheet" hidden>
  <p class="eyebrow">晚安</p>
  <h2>弹完啦</h2>
  <p class="sub" id="endText">最后的和弦要让声音自己消失，才算真正睡着。</p>
  <div class="btns">
    <button class="btn primary" id="endAgain">再弹一次</button>
    <button class="btn" id="endMenu">回到首页</button>
  </div>
</section>

<div class="toast" id="toast" role="status"></div>

<script>
// Pure logic: score parsing, onset detection, pitch-class detection, score following.
// No DOM access, so it can be tested in Node.
(function (root) {
  'use strict';

  var PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  var NAMES = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];

  // ---------------------------------------------------------------- score
  // Text format: note letters separated by spaces, bars separated by | or a new line.
  // '#' sharp, 'b' flat (after an UPPERCASE letter), ':n' beats (default 1).
  // A rest (no sound) is written 0 or R, also with ':n' beats, e.g. 0:1.
  function parseScore(text) {
    var s = String(text || '').replace(/[＃♯]/g, '#').replace(/♭/g, 'b').replace(/｜/g, '|').replace(/０/g, '0');
    var events = [], tokens = [], bar = 1, barHasNote = false, i = 0, m, beats;
    function readBeats() {
      var bt = 1;
      if (s.charAt(i) === ':') {
        m = /^:(\d+(?:\.\d+)?)/.exec(s.slice(i));
        if (m) { bt = parseFloat(m[1]); i += m[0].length; } else { i++; }
      }
      return bt > 0 ? bt : 1;
    }
    while (i < s.length) {
      var ch = s.charAt(i);
      if (ch === '|' || ch === '\n') {
        if (barHasNote) { bar++; barHasNote = false; }
        i++;
        continue;
      }
      if (ch === '0' || ch === 'R' || ch === 'r') {
        i++;
        beats = readBeats();
        tokens.push({ rest: true, beats: beats, bar: bar });
        barHasNote = true;
        continue;
      }
      if (/[A-Ga-g]/.test(ch)) {
        var upper = ch === ch.toUpperCase();
        var pc = PC[ch.toUpperCase()];
        i++;
        var acc = 0;
        if (s.charAt(i) === '#') { acc = 1; i++; }
        else if (s.charAt(i) === 'b' && upper) { acc = -1; i++; }
        beats = readBeats();
        var ev = { pc: (((pc + acc) % 12) + 12) % 12, beats: beats, bar: bar };
        events.push(ev); tokens.push(ev);
        barHasNote = true;
        continue;
      }
      i++;
    }
    var bars = tokens.length ? tokens[tokens.length - 1].bar : 0;
    var barBeats = [], barFirst = [], barStart = [], t = 0, b, k;
    for (b = 1; b <= bars; b++) { barBeats[b] = 0; barFirst[b] = -1; }
    for (k = 0; k < tokens.length; k++) {
      var tk = tokens[k];
      tk.start = t;
      t += tk.beats;
      barBeats[tk.bar] += tk.beats;
      if (barStart[tk.bar] === undefined) barStart[tk.bar] = tk.start;
    }
    for (k = 0; k < events.length; k++) {
      var e = events[k];
      e.beatInBar = e.start - barStart[e.bar];
      if (barFirst[e.bar] < 0) barFirst[e.bar] = k;
    }
    return { events: events, bars: bars, totalBeats: t, barBeats: barBeats, barFirst: barFirst };
  }

  // Position in the piece as a bar number with fraction, 0-based: 0 = start of bar 1.
  function barPosOf(score, idx) {
    if (!score || idx < 0) return 0;
    var e = score.events[idx];
    var bb = score.barBeats[e.bar] || 1;
    return (e.bar - 1) + Math.min(0.999, e.beatInBar / bb);
  }

  // ------------------------------------------------------- onset detector
  // Spectral-flux onset detector. push() takes linear magnitudes of one frame.
  function createOnsetDetector(opt) {
    opt = opt || {};
    var lo = opt.loHz || 120, hi = opt.hiHz || 1800;
    var minGap = opt.minGap || 0.12;
    var absMin = opt.absMin || 6;
    var ratio = opt.ratio || 2.6;
    var scale = opt.scale || 2000;
    var prev = null, f1 = 0, f2 = 0, lastOn = -10;
    var avg = 0, n = 0;
    function reset() { prev = null; f1 = f2 = 0; lastOn = -10; avg = 0; n = 0; }
    // returns the time of the onset (frame time) or -1
    function push(mag, binHz, t) {
      var a = Math.max(1, Math.floor(lo / binHz)), z = Math.min(mag.length - 1, Math.ceil(hi / binHz));
      var flux = 0, i, c;
      if (prev === null || prev.length !== mag.length) prev = new Float32Array(mag.length);
      for (i = a; i <= z; i++) {
        c = Math.log(1 + mag[i] * scale);
        var d = c - prev[i];
        if (d > 0) flux += d;
        prev[i] = c;
      }
      // peak picking with one frame delay
      var out = -1;
      var thr = Math.max(absMin, ratio * avg);
      if (f1 > thr && f1 >= f2 && f1 > flux && (t - lastOn) > minGap) {
        out = t;
        lastOn = t;
      }
      // running mean of flux (slow), not updated by onset frames so it stays a noise level
      if (flux < Math.max(absMin, ratio * avg)) {
        avg = n < 20 ? (avg * n + flux) / (n + 1) : avg * 0.97 + flux * 0.03;
        n++;
      }
      f2 = f1; f1 = flux;
      return out;
    }
    return { push: push, reset: reset };
  }

  // -------------------------------------------------- pitch-class detector
  var HW = [1, 0.7, 0.5, 0.35, 0.25];
  function peakNear(mag, x) {
    var c = Math.round(x), best = 0, k;
    for (k = c - 1; k <= c + 1; k++) if (k > 0 && k < mag.length && mag[k] > best) best = mag[k];
    return best;
  }
  // mag: linear magnitudes, binHz: Hz per bin. Returns {midi, pc, dev, conf} or null.
  function detectPitch(mag, binHz, opt) {
    opt = opt || {};
    var tune = opt.tune || 0, minM = opt.minMidi || 58, maxM = opt.maxMidi || 84;
    var best = -1, bestS = 0, sum = 0, cnt = 0, m, h, s, f0, f;
    for (m = minM; m <= maxM; m++) {
      f0 = 440 * Math.pow(2, (m - 69 + tune) / 12);
      s = 0;
      for (h = 1; h <= HW.length; h++) {
        f = f0 * h;
        if (f / binHz > mag.length - 3) break;
        s += HW[h - 1] * peakNear(mag, f / binHz);
      }
      sum += s; cnt++;
      if (s > bestS) { bestS = s; best = m; }
    }
    if (best < 0 || bestS <= 0) return null;
    var mean = sum / cnt;
    // refine deviation from the fundamental peak
    f0 = 440 * Math.pow(2, (best - 69 + tune) / 12);
    var c = Math.round(f0 / binHz), dev = 0;
    if (c > 1 && c < mag.length - 2) {
      var pk = c;
      if (mag[c - 1] > mag[pk]) pk = c - 1;
      if (mag[c + 1] > mag[pk]) pk = c + 1;
      var a = mag[pk - 1], b = mag[pk], g = mag[pk + 1];
      var den = a - 2 * b + g;
      var off = den !== 0 ? 0.5 * (a - g) / den : 0;
      var fp = (pk + off) * binHz;
      dev = 12 * Math.log(fp / f0) / Math.LN2;
      if (!isFinite(dev) || Math.abs(dev) > 0.6) dev = 0;
    }
    return { midi: best, pc: ((best % 12) + 12) % 12, dev: dev + tune, conf: mean > 0 ? bestS / mean : 0, score: bestS };
  }

  // -------------------------------------------------------------- tracker
  // Follows the right-hand note list. Position = index of the last matched event.
  function createTracker(score, opt) {
    opt = opt || {};
    var ev = score.events, n = ev.length;
    var st = { pos: -1, lastT: 0, unmatched: 0, recent: [], beatSec: opt.beatSec || 0.75 };
    var HOLD = 0.65, WIN = 6;

    function push(pc) {
      if (pc === null || pc === undefined) return;
      st.recent.push(pc);
      if (st.recent.length > WIN) st.recent.shift();
    }
    function advance(idx, t) {
      var cur = st.pos;
      if (idx - cur === 1 && cur >= 0) {
        var el = t - st.lastT;
        var meas = el / ev[cur].beats;
        if (el < 4 && meas > 0.2 && meas < 2.5) st.beatSec = st.beatSec * 0.75 + meas * 0.25;
      }
      st.pos = idx; st.lastT = t; st.unmatched = 0;
    }
    // how many of the last w detected pitch classes agree with the score ending at idx
    function agree(idx, w) {
      var j, c = 0;
      if (idx < w - 1) return 0;
      for (j = 0; j < w; j++) if (ev[idx - j].pc === st.recent[st.recent.length - 1 - j]) c++;
      return c;
    }
    // fuzzy re-alignment: jump when another place explains the recent notes clearly better
    function align(t) {
      var w = Math.min(WIN, st.recent.length);
      if (w < 5) return false;
      var cs = st.pos >= 0 ? agree(st.pos, w) : 0, best = -1, bs = 0, bd = 1e9, idx, s, d;
      for (idx = w - 1; idx < n; idx++) {
        s = agree(idx, w);
        if (s < w - 1) continue;
        d = idx >= st.pos ? idx - st.pos : (st.pos - idx) + 2;
        if (s > bs || (s === bs && d < bd)) { bs = s; bd = d; best = idx; }
      }
      if (best >= 0 && best !== st.pos && bs >= cs + 2) {
        st.pos = best; st.lastT = t; st.unmatched = 0;
        return true;
      }
      return false;
    }

    // pc: detected pitch class (0-11) or null; t: seconds.
    function onOnset(pc, t) {
      var cur = st.pos, step, idx, res = null;
      var elapsed = t - st.lastT;
      var curDur = cur >= 0 ? ev[cur].beats * st.beatSec : 0;
      // a second onset inside a long held note is usually the other hand
      if (cur >= 0 && ev[cur].beats >= 1.5 && elapsed < HOLD * curDur) {
        var nextIsNew = cur + 1 < n && pc !== null && ev[cur + 1].pc === pc && ev[cur + 1].pc !== ev[cur].pc;
        if (!nextIsNew) return { status: 'hold', pos: st.pos };
      }
      if (pc !== null) {
        for (step = 1; step <= 3; step++) {
          idx = cur + step;
          if (idx >= n) break;
          if (ev[idx].pc === pc) { push(pc); advance(idx, t); res = { status: 'advance', skipped: step - 1 }; break; }
        }
        if (!res && cur >= 0 && ev[cur].pc === pc) return { status: 'same', pos: st.pos };
      }
      if (!res) {
        push(pc);
        st.unmatched++;
        if (cur >= 0 && st.unmatched >= 2 && elapsed >= 0.8 * curDur && cur + 1 < n) {
          advance(cur + 1, t);
          st.unmatched = 1;
          res = { status: 'soft' };
        } else {
          res = { status: 'unmatched' };
        }
      }
      if (align(t)) res = { status: 'resync' };
      res.pos = st.pos;
      return res;
    }

    return {
      onOnset: onOnset,
      state: st,

    if (finaleT >= 0 && !endShown && now - finaleT > 9 && mode !== 'menu' && !recordStd) {

      $('endText').textContent = mode === 'demo' ? '这是一遍示范。接下来换你来弹。' : '最后的和弦要让声音自己消失，才算真正睡着。';
      setSheetNone(); $('endSheet').hidden = false;
    }
  }

  // ---------- frame loop
  var last = 0;
  function frame(ts) {
    var now = ts / 1000, dt = clamp(now - (last || now - 0.016), 0.001, 0.1);
    last = now; nowT = now;
    if (mode === 'listen' && anA) { analyze(now, dt); if (!tracker) clockStep(now); }
    else if (mode === 'demo' && demo) demoStep(now, dt);
    else { level = 0.25; }
    P += (Pt - P) * Math.min(1, dt * 3);
    var target = mode === 'demo' ? NS.dynAt(P) : mode === 'listen' ? 0.7 * clamp(level, 0, 1) + 0.3 * NS.dynAt(P) : 0.3;
    inten += (target - inten) * Math.min(1, dt * 4);
    updateCaption();
    scene.setClock(now);
    scene.draw({ P: P, inten: inten, time: now, finaleAge: finaleT >= 0 ? now - finaleT : -1, dpr: dpr }, dt);
    updateHud(now);
    window.requestAnimationFrame(frame);
  }
  window.requestAnimationFrame(frame);

  // ---------- buttons
  $('btnStart').addEventListener('click', function () { startListen(false); });
  $('btnStd').addEventListener('click', function () { startListen(true); });
  $('btnDemo').addEventListener('click', startDemo);
  $('btnExit').addEventListener('click', stopAll);
  $('btnRestart').addEventListener('click', function () { resetRun(); secShown = -1; setSheetNone(); });
  $('btnDone').addEventListener('click', finishStd);
  $('barPrev').addEventListener('click', function () { jumpBar(-1); });
  $('barNext').addEventListener('click', function () { jumpBar(1); });
  $('endAgain').addEventListener('click', function () { resetRun(); secShown = -1; setSheetNone(); if (mode === 'demo') { demo.t0 = nowT; demo.nextNote = nowT + 0.6; } });
  $('endMenu').addEventListener('click', stopAll);

  function parseStatus() {
    var s = NT.parseScore($('scoreText').value), el = $('scoreParse');
    if (!s.events.length) { el.textContent = '还没有音。'; el.className = 'status'; $('barChips').innerHTML = ''; return s; }
    var txt = '识别到 ' + s.events.length + ' 个音，' + s.bars + ' 小节' + (s.events.length < 6 ? '（至少 6 个音才会用来跟谱）' : '');
    var cnt = {}, best = 0, modeV = 0, k, odd = [];
    for (k = 1; k < s.bars; k++) { var key = String(s.barBeats[k]); cnt[key] = (cnt[key] || 0) + 1; if (cnt[key] > best) { best = cnt[key]; modeV = s.barBeats[k]; } }
    for (k = 1; k < s.bars; k++) if (Math.abs(s.barBeats[k] - modeV) > 1e-6) odd.push(k);
    if (s.bars >= 4 && odd.length) txt += '。第 ' + odd.join('、') + ' 小节的拍数和多数小节（' + modeV + ' 拍）不一样，请检查是不是漏了长音的拍数，或多点了一个音。';
    el.textContent = txt;
    var chips = $('barChips'), parts = [], bn = [], q;
    for (q = 1; q <= s.bars; q++) bn[q] = 0;
    s.events.forEach(function (e) { bn[e.bar]++; });
    for (q = 1; q <= s.bars; q++) {
      var bad = s.bars >= 4 && q < s.bars && Math.abs(s.barBeats[q] - modeV) > 1e-6;
      parts.push('<span class="' + (bad ? 'bad' : '') + '"><b>' + q + '</b> · ' + bn[q] + ' 音 ' + s.barBeats[q] + ' 拍</span>');
    }
    chips.innerHTML = parts.join('');
    el.className = 'status' + (s.events.length >= 6 && !(s.bars >= 4 && odd.length) ? ' ok' : '');
    return s;
  }
  $('btnScore').addEventListener('click', function () { $('scoreText').value = scoreText; parseStatus(); setSheet('scoreSheet'); });
  $('scoreText').addEventListener('input', parseStatus);
  function kbdPress(k) {
    var ta = $('scoreText'), v = ta.value;
    if (/^[A-G]$/.test(k)) {
      v = v.replace(/[ \t]+$/, '');
      v += (v && !/[\n|]$/.test(v) ? ' ' : (v ? ' ' : '')) + k + ' ';
    } else if (k === '#' || k === 'b') {
      v = v.replace(/[ \t]+$/, '');
      if (/[A-G]$/.test(v)) v += k;
      v += ' ';
    } else if (k === '0') {
      v = v.replace(/[ \t]+$/, '');
      v += (v && !/\|$/.test(v) ? ' ' : (v ? ' ' : '')) + '0:1 ';
    } else if (k.charAt(0) === ':') {
      v = v.replace(/[ \t]+$/, '').replace(/:\d+(\.\d+)?$/, '');
      if (/[A-G][#b]?$/.test(v) || /(^|[ |])0$/.test(v)) v += k;
      v += ' ';
    } else if (k === '|') {
      v = v.replace(/[ \t]+$/, '');
      if (v && !/\|$/.test(v)) v += ' | ';
    } else if (k === 'back') {
      v = v.replace(/[ \t]+$/, '').replace(/(\S+)$/, '').replace(/[ \t]+$/, '');
      if (v) v += ' ';
    }
    ta.value = v; ta.scrollTop = ta.scrollHeight; parseStatus();
  }
  $('kbd').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b || !b.getAttribute('data-k')) return;
    kbdPress(b.getAttribute('data-k'));
  });
  $('kbdSys').addEventListener('click', function () {
    var ta = $('scoreText'), sys = ta.getAttribute('inputmode') === 'none';
    ta.setAttribute('inputmode', sys ? 'text' : 'none');
    $('kbdSys').textContent = sys ? '收起键盘' : '手机键盘';
    if (sys) ta.focus(); else ta.blur();
  });
  $('scoreSave').addEventListener('click', function () {
    scoreText = $('scoreText').value; score = NT.parseScore(scoreText); hasScore = score.events.length >= 6;
    save('score', scoreText); refreshMenu(); setSheet('menu'); toast('乐谱已保存');
  });
  $('scoreClear').addEventListener('click', function () { $('scoreText').value = ''; parseStatus(); });
  $('scoreCancel').addEventListener('click', function () { setSheet('menu'); });

  // exposed for tests
  window.__night = { startDemo: startDemo, startListen: startListen, state: function () { return { mode: mode, P: P, Pt: Pt, inten: inten, finaleT: finaleT, lastNote: lastNote, level: level }; } };
})();
</script>
