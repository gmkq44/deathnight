<title>午夜时分</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap">
<style>
  /* Layout: full-screen night hallway; captions top-left, controls and sheets anchored to the bottom edge. */
  :root {
    --ink: #080c1a;
    --night: #121a35;
    --moon: #d2e4ff;
    --lamp: #ffc07a;
    --mist: #8a9cc8;
    --warn: #ffb35c;
    --display: "ZCOOL XiaoWei", "Songti SC", "Noto Serif SC", "STSong", serif;
    --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--moon);
    font: 15px/1.6 var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .top {
    position: fixed; left: 0; right: 0; top: 0; z-index: 3; display: flex; gap: 8px; justify-content: flex-end;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0;
  }
  .chip {
    font: 500 14px/1 var(--body); color: var(--moon); background: rgba(8, 12, 26, .55);
    border: 1px solid rgba(210, 228, 255, .28); border-radius: 999px; padding: 10px 14px; min-height: 40px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .chip.pulse { border-color: var(--lamp); color: var(--lamp); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(255, 192, 122, .18); } }

  .cap {
    position: fixed; left: 0; right: 0; top: 0; z-index: 2; pointer-events: none;
    padding: calc(64px + env(safe-area-inset-top, 0px)) 20px 0; max-width: 30rem;
    transition: opacity .6s ease;
  }
  .cap.off { opacity: 0; }
  .cap .line { margin: 0; font: 400 clamp(22px, 6.2vw, 30px)/1.35 var(--display); text-wrap: balance; text-shadow: 0 2px 14px rgba(8, 12, 26, .9); }
  .cap .desc { margin: 10px 0 0; max-width: 24rem; font: 400 13.5px/1.7 var(--body); color: var(--moon); opacity: .86; text-shadow: 0 1px 8px rgba(8, 12, 26, .98), 0 0 16px rgba(8, 12, 26, .9); }
  .cap.nodesc .desc { display: none; }
  .cap .hint { margin: 8px 0 0; font: 500 13px/1.4 var(--body); color: var(--lamp); letter-spacing: .04em; text-shadow: 0 1px 8px rgba(8, 12, 26, .95); }

  .hud {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, rgba(8, 12, 26, .88), rgba(8, 12, 26, 0));
    display: flex; flex-direction: column; gap: 10px;
  }
  .meter { position: relative; height: 10px; border-radius: 6px; background: rgba(210, 228, 255, .14); overflow: visible; }
  .meter .fill { height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, var(--mist), var(--moon)); transition: background .2s; }
  .meter.low .fill { background: linear-gradient(90deg, #b37a3a, var(--warn)); }
  .meter .tick { position: absolute; top: -5px; width: 3px; height: 20px; border-radius: 2px; background: var(--lamp); left: 0; }
  .row { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; font-size: 13px; color: var(--mist); }
  .row b { color: var(--moon); font-weight: 500; font-variant-numeric: tabular-nums; }
  #stVol.low { color: var(--warn); font-weight: 700; }
  .row.ctrl { gap: 8px; justify-content: flex-start; }
  .row.ctrl .chip { flex: 1 1 0; min-width: 0; }

  .sheet {
    position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, rgba(8, 12, 26, .97) 45%, rgba(8, 12, 26, .6) 75%, rgba(8, 12, 26, .1));
    overflow-y: auto;
  }
  .sheet > * { max-width: 30rem; width: 100%; }
  .eyebrow { margin: 0; font: 500 12px/1 var(--body); letter-spacing: .18em; color: var(--lamp); }
  h1 { margin: 0; font: 400 clamp(44px, 14vw, 72px)/1.05 var(--display); letter-spacing: .02em; }
  h2 { margin: 0; font: 400 28px/1.2 var(--display); }
  .sub { margin: 0; color: var(--mist); }
  .sub b { color: var(--moon); font-weight: 500; }
  .msg { margin: 0; padding: 10px 12px; border-radius: 10px; background: rgba(255, 179, 92, .12); border: 1px solid rgba(255, 179, 92, .4); color: #ffd9aa; font-size: 14px; }
  .btns { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    font: 700 16px/1 var(--body); min-height: 52px; border-radius: 14px; padding: 0 18px; cursor: pointer;
    color: var(--moon); background: transparent; border: 1px solid rgba(210, 228, 255, .35);
  }
  .btn.primary { background: var(--lamp); color: var(--ink); border-color: var(--lamp); }
  .btn.small { min-height: 44px; font-size: 14px; font-weight: 500; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font-family: inherit; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
  textarea {
    width: 100%; min-height: 22vh; resize: vertical; border-radius: 12px; padding: 12px;
    background: rgba(210, 228, 255, .07); color: var(--moon); border: 1px solid rgba(210, 228, 255, .3);
    font: 500 17px/1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em;
  }
  .kbd { display: flex; flex-direction: column; gap: 8px; }
  .kbd-row { display: grid; gap: 8px; }
  .kbd-row.n7 { grid-template-columns: repeat(7, 1fr); }
  .kbd-row.n6 { grid-template-columns: repeat(6, 1fr); }
  .kbd-row.n3 { grid-template-columns: 1.4fr 1fr 1fr 1.2fr; }
  .kbd button { min-height: 48px; min-width: 0; padding: 0 4px; border-radius: 10px; font: 700 17px/1 var(--body); color: var(--moon); background: rgba(210, 228, 255, .1); border: 1px solid rgba(210, 228, 255, .28); }
  .kbd button:active { background: rgba(255, 192, 122, .3); }
  .kbd .n6 button, .kbd .n3 button { font-size: 14px; font-weight: 500; }
  #scoreSheet { justify-content: flex-start; }
  #scoreSheet > * { flex-shrink: 0; }
  #scoreSheet > .barlist { flex: 1 1 160px; min-height: 160px; overflow-y: auto; }
  .barlist { display: flex; flex-direction: column; gap: 6px; padding-right: 2px; }
  .brow { display: grid; grid-template-columns: 2.2em 1fr auto auto auto; gap: 8px; align-items: center; padding: 4px 6px 4px 8px; border-radius: 10px; border: 1px solid rgba(210, 228, 255, .2); background: rgba(210, 228, 255, .05); }
  .brow.act { border-color: var(--lamp); background: rgba(255, 192, 122, .1); }
  .brow.bad { border-color: var(--warn); }
  .brow .bn { font: 700 14px/1 var(--body); color: var(--moon); text-align: center; font-variant-numeric: tabular-nums; }
  .brow input { min-width: 0; width: 100%; background: transparent; border: 0; color: var(--moon); padding: 9px 2px; font: 500 16px/1.2 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .03em; }
  .brow input:focus { outline: none; }
  .brow .bi { font: 500 12px/1.3 var(--body); color: var(--mist); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .brow.bad .bi { color: var(--warn); font-weight: 700; }
  .brow .bp { width: 36px; height: 32px; border-radius: 8px; border: 1px solid rgba(255, 192, 122, .5); background: transparent; color: var(--lamp); font-size: 13px; }
  .brow.playing .bp { background: var(--lamp); color: var(--ink); }
  .brow .bx { width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: var(--mist); font-size: 18px; }
  .more { color: var(--mist); font-size: 13px; }
  .more summary { cursor: pointer; padding: 6px 0; }
  .more textarea { margin: 8px 0; min-height: 80px; }
  .more .split, .more > .btn { margin-top: 8px; width: 100%; }
  .bars { display: flex; flex-wrap: wrap; gap: 6px; }
  .bars span { padding: 5px 8px; border-radius: 8px; border: 1px solid rgba(210, 228, 255, .22); font: 500 12px/1.3 var(--body); color: var(--mist); font-variant-numeric: tabular-nums; }
  .bars span b { color: var(--moon); font-weight: 700; }
  .bars span.bad { border-color: var(--warn); color: var(--warn); }
  .bars span.bad b { color: var(--warn); }
  .status { margin: 0; font-size: 13px; color: var(--mist); font-variant-numeric: tabular-nums; }
  .status.ok { color: #9fe0b5; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(110px + env(safe-area-inset-bottom, 0px)); z-index: 9;
    max-width: 88vw; padding: 10px 14px; border-radius: 12px; background: rgba(210, 228, 255, .94); color: var(--ink); font-weight: 500; font-size: 14px;
    transition: opacity .4s; opacity: 0; pointer-events: none;
  }
  .toast.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .chip.pulse { animation: none; } .cap { transition: none; } }
</style>

<canvas id="stage" aria-label="午夜走廊的动画画面"></canvas>

<div class="top" id="top">
  <button class="chip pulse" id="btnDone" hidden>完成并保存标准</button>
  <button class="chip" id="btnTips" hidden>说明</button>
  <button class="chip" id="btnRestart" hidden>重来</button>
  <button class="chip" id="btnExit" hidden>退出</button>
</div>

<div class="cap off" id="cap"><p class="line" id="capLine"></p><p class="hint" id="capHint"></p><p class="desc" id="capDesc"></p></div>

<div class="hud" id="hud" hidden>
  <div class="meter" id="meter"><div class="fill" id="mFill"></div><div class="tick" id="mTick"></div></div>
  <div class="row"><span id="stBar">第 <b>1</b> / 18 小节</span><span id="stNote">听到 <b>—</b></span><span id="stVol">音量</span></div>
  <div class="row ctrl"><button class="chip" id="barPrev">◀ 上一小节</button><button class="chip" id="barNext">下一小节 ▶</button></div>
</div>

<section class="sheet" id="menu">
  <p class="eyebrow">钢琴练习伴侣</p>
  <h1>午夜时分</h1>
  <p class="sub">手机放在琴谱架上，点开始，弹给手机听。画面会跟着你弹到的地方和力度变化。</p>
  <p class="msg" id="menuMsg" hidden></p>
  <p class="status" id="scoreStatus"></p>
  <p class="status" id="stdStatus"></p>
  <div class="btns">
    <button class="btn primary" id="btnStart">开始演奏</button>
    <div class="split">
      <button class="btn small" id="btnDemo">看一遍画面</button>
      <button class="btn small" id="btnScore">乐谱设置</button>
    </div>
    <button class="btn small" id="btnPlay">听示范（按乐谱出声音）</button>
    <button class="btn small" id="btnStd">记录标准音量</button>
  </div>
</section>

<section class="sheet" id="scoreSheet" hidden>
  <h2>乐谱设置</h2>
  <p class="sub">一个小节一行。点一行选中它，再用下面的按键填音；填完点“下一小节”跳到下一行。长音点“2 拍”“3 拍”，不点就是 1 拍；没声音的拍点“休止”。拍数不对的小节会变橙色，直接点那一行修改。</p>
  <p class="status" id="scoreParse"></p>
  <div class="barlist" id="barList" aria-label="每个小节"></div>
  <div class="kbd" id="kbd">
    <div class="kbd-row n7">
      <button type="button" data-k="C">C</button><button type="button" data-k="D">D</button><button type="button" data-k="E">E</button><button type="button" data-k="F">F</button><button type="button" data-k="G">G</button><button type="button" data-k="A">A</button><button type="button" data-k="B">B</button>
    </div>
    <div class="kbd-row n6">
      <button type="button" data-k="#">升 #</button><button type="button" data-k="b">降 b</button><button type="button" data-k=":2">2 拍</button><button type="button" data-k=":3">3 拍</button><button type="button" data-k=":4">4 拍</button><button type="button" data-k=":0.5">半拍</button>
    </div>
    <div class="kbd-row n3">
      <button type="button" data-k="|">下一小节</button><button type="button" data-k="0">休止 0</button><button type="button" data-k="back">退格</button><button type="button" id="kbdSys">手机键盘</button>
    </div>
  </div>
  <div class="split">
    <button class="btn primary" id="scoreSave">保存</button>
    <button class="btn" id="scoreCancel">取消</button>
  </div>
  <details class="more">
    <summary>更多：粘贴整段 / 复制链接 / 清空</summary>
    <textarea id="scorePaste" spellcheck="false" placeholder="把整段乐谱粘贴在这里，小节用 | 分开，然后点“拆成小节”"></textarea>
    <div class="split">
      <button class="btn small" id="scoreSplit">拆成小节</button>
      <button class="btn small" id="scoreClear">清空乐谱</button>
    </div>
    <button class="btn small" id="scoreLink">复制乐谱链接（打开链接自动导入）</button>
  </details>
</section>

<section class="sheet" id="endSheet" hidden>
  <p class="eyebrow">晚安</p>
  <h2>弹完啦</h2>
  <p class="sub" id="endText">最后的和弦要让声音自己消失，才算真正睡着。</p>
  <div class="btns">
    <button class="btn primary" id="endAgain">再弹一次</button>
    <button class="btn" id="endMenu">回到首页</button>
  </div>
</section>

<div class="toast" id="toast" role="status"></div>

/*__SCENE__*/

<script>
(function () {
  'use strict';
  var NT = window.NightTracker, NS = window.NightScene;
  function $(id) { return document.getElementById(id); }
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  var cv = $('stage'), ctx = cv.getContext('2d');
  var cs = getComputedStyle(document.documentElement);
  function tok(n) { return cs.getPropertyValue(n).trim() || undefined; }
  var scene = NS.create(ctx, { ink: tok('--ink'), moon: tok('--moon'), lamp: tok('--lamp') });
  var dpr = 1;
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = cv.clientWidth || window.innerWidth, h = cv.clientHeight || window.innerHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    scene.resize(w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- storage (may be unavailable)
  var KEY = 'dead-of-night.v1.';
  function load(k) { try { return localStorage.getItem(KEY + k); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(KEY + k, v); } catch (e) { } }

  // ---------- state
  var BARS_DEFAULT = 18;
  var scoreText = load('score') || '';
  var score = NT.parseScore(scoreText), hasScore = score.events.length >= 6;
  var stdRef = parseFloat(load('std')) || 0;
  var mode = 'menu', recordStd = false;
  var ac = null, stream = null, anA = null, anB = null, fdA, fdB, magA, magB, td, binA, binB;
  var od = null, tracker = null, calibrated = false, calib = null, noiseRms = 0, pending = null;
  var tune = 0, devs = [], lvlPeak = 0, ref = 0.03, level = 0, inten = 0.3;
  var P = 0.18, Pt = 0.18, finaleT = -1, clockStart = -1, nowT = 0, lastNote = '—', recent = [], stdPeaks = [];
  var secShown = -1, endShown = false, lowFlag = false, wl = null;
  var demo = null;

  // ---------- UI helpers
  var toastTimer = 0;
  function toast(t) {
    var el = $('toast'); el.textContent = t; el.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove('on'); }, 3200);
  }
  function showMsg(t) { var m = $('menuMsg'); m.hidden = !t; m.textContent = t || ''; }
  function refreshMenu() {
    $('scoreStatus').textContent = hasScore
      ? '乐谱：' + score.events.length + ' 个音，' + score.bars + ' 小节。画面会按你弹到的音跟着走。'
      : '还没有输入乐谱：画面会按时间往前走，也可以用 ◀ ▶ 手动对齐小节。';
    $('scoreStatus').className = 'status' + (hasScore ? ' ok' : '');
    $('stdStatus').textContent = stdRef > 0
      ? '标准音量：已记录。练习时会对照它提醒你“再大一点”。'
      : '标准音量：还没记录。先让老师认可的大声版本弹一遍记下来。';
    $('stdStatus').className = 'status' + (stdRef > 0 ? ' ok' : '');
  }
  refreshMenu();

  function setSheet(id) {
    ['menu', 'scoreSheet', 'endSheet'].forEach(function (s) { $(s).hidden = s !== id; });
  }
  function setPlayingUi(on) {
    $('hud').hidden = !on; $('btnRestart').hidden = !on; $('btnTips').hidden = !on; $('btnExit').hidden = !on;
    $('btnDone').hidden = !(on && recordStd);
    $('cap').classList.toggle('off', !on);
    if (!on) setSheet('menu');
    else setSheet('');
  }
  function setSheetNone() { ['menu', 'scoreSheet', 'endSheet'].forEach(function (s) { $(s).hidden = true; }); }

  // ---------- wake lock
  function lockOn() { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (l) { wl = l; }, function () { }); } catch (e) { } }
  function lockOff() { try { if (wl) wl.release(); } catch (e) { } wl = null; }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && (mode === 'listen' || mode === 'demo')) lockOn();
  });

  // ---------- microphone
  function micError(e) {
    var n = e && e.name;
    if (n === 'NotFoundError' || n === 'DevicesNotFoundError') return '找不到麦克风。请检查手机的麦克风是否可用。';
    if (n === 'NotReadableError') return '麦克风正被其他应用占用。请关闭其他用到麦克风的应用后再试。';
    return '没能打开麦克风。请在浏览器网址栏允许使用麦克风。如果是在预览窗口里打开的，浏览器会直接禁止麦克风，需要把这个文件放到自己的 https 网址上再打开。';
  }
  function cleanupAudio() {
    try { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) { }
    try { if (ac && ac.state !== 'closed') ac.close(); } catch (e) { }
    stream = null; ac = null; anA = anB = null;
  }
  function startListen(rec) {
    showMsg('');
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showMsg('这个浏览器或这个页面不能使用麦克风。请用 Chrome 或 Safari 打开 https 网址。');
      return;
    }
    try { ac = new AC(); } catch (e) { showMsg('这个浏览器不支持声音分析。'); return; }
    var resumed = ac.resume ? ac.resume() : Promise.resolve();
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } })
      .then(function (s) { stream = s; return resumed; })
      .then(function () { beginListening(rec); })
      .catch(function (e) { cleanupAudio(); showMsg(micError(e)); });
  }
  function beginListening(rec) {
    var src = ac.createMediaStreamSource(stream);
    anA = ac.createAnalyser(); anA.fftSize = 2048; anA.smoothingTimeConstant = 0;
    anB = ac.createAnalyser(); anB.fftSize = 8192; anB.smoothingTimeConstant = 0;
    src.connect(anA); src.connect(anB);
    fdA = new Float32Array(anA.frequencyBinCount); magA = new Float32Array(anA.frequencyBinCount);
    fdB = new Float32Array(anB.frequencyBinCount); magB = new Float32Array(anB.frequencyBinCount);
    td = new Float32Array(anA.fftSize);
    binA = ac.sampleRate / anA.fftSize; binB = ac.sampleRate / anB.fftSize;
    od = NT.createOnsetDetector();
    tracker = hasScore ? NT.createTracker(score, { beatSec: 0.75 }) : null;
    calibrated = false; calib = { t0: nowT, n: 0, sum: 0 }; noiseRms = 0; pending = null;
    devs = []; tune = 0; lvlPeak = 0; recent = []; stdPeaks = [];
    recordStd = !!rec; mode = 'listen';
    resetRun();
    setPlayingUi(true);
    $('capLine').textContent = '先安静一秒，手机在听周围有多安静……';
    $('capHint').textContent = recordStd ? '记录中：弹一遍老师认可的大声版本' : ''; $('capDesc').textContent = '';
    secShown = -2;
    lockOn();
  }
  function stopAll() {
    cleanupAudio(); stopDemoSound(); lockOff();
    mode = 'menu'; recordStd = false; demo = null;
    Pt = 0.18; inten = 0.3; finaleT = -1; endShown = false;
    setPlayingUi(false);
    refreshMenu();
  }
  function resetRun() {
    if (tracker) tracker.reset();
    Pt = 0; P = 0; finaleT = -1; clockStart = -1; endShown = false; lowFlag = false;
    if (demo) { demo.t0 = nowT; demo.idx = 0; demo.nextNote = nowT + 0.6; }
    scene.reset();
  }

  // ---------- analysis loop pieces
  function median(a) { var b = a.slice().sort(function (x, y) { return x - y; }); return b[Math.floor(b.length / 2)]; }
  function analyze(now, dt) {
    var i, v, s = 0;
    anA.getFloatFrequencyData(fdA);
    for (i = 0; i < fdA.length; i++) { v = fdA[i]; magA[i] = v > -120 ? Math.pow(10, v / 20) : 0; }
    anA.getFloatTimeDomainData(td);

    if (k === '|') { nextBar(); return; }
    var row = $('barList').children[actBar]; if (!row) return;
    barsArr[actBar] = editBar(barsArr[actBar], k);
    row.querySelector('input').value = barsArr[actBar];
    parseStatus();
  }
  $('kbd').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b || !b.getAttribute('data-k')) return;
    kbdPress(b.getAttribute('data-k'));
  });
  $('kbdSys').addEventListener('click', function () {
    var sys = kbdMode === 'none';
    kbdMode = sys ? 'text' : 'none';
    var ins = $('barList').querySelectorAll('input'), i;
    for (i = 0; i < ins.length; i++) ins[i].setAttribute('inputmode', kbdMode);
    $('kbdSys').textContent = sys ? '收起键盘' : '手机键盘';
    var cur = ins[actBar]; if (cur) { if (sys) cur.focus(); else cur.blur(); }
  });
  $('scoreSave').addEventListener('click', function () {
    stopPreview();
    scoreText = serialize(); score = NT.parseScore(scoreText); hasScore = score.events.length >= 6;
    save('score', scoreText); refreshMenu(); setSheet('menu'); toast('乐谱已保存');
  });
  $('scoreClear').addEventListener('click', function () { barsArr = ['']; actBar = 0; renderBars(0); });
  $('scoreSplit').addEventListener('click', function () {
    var t = $('scorePaste').value;
    if (!t.trim()) return;
    barsArr = splitBars(t); $('scorePaste').value = ''; renderBars(0); toast('已拆成 ' + barsArr.length + ' 个小节');
  });
  $('scoreCancel').addEventListener('click', function () { stopPreview(); setSheet('menu'); });

  // score link: the score travels in the URL hash, never in the source or the repository
  $('scoreLink').addEventListener('click', function () {
    var txt = serialize();
    if (!txt) { toast('乐谱是空的'); return; }
    var url = location.href.split('#')[0] + '#s=' + encodeURIComponent(txt);
    var done = function () { toast('链接已复制'); };
    try { navigator.clipboard.writeText(url).then(done, function () { window.prompt('复制这个链接', url); }); }
    catch (e) { window.prompt('复制这个链接', url); }
  });
  (function importFromHash() {
    var m = /^#s=(.+)$/.exec(location.hash);
    if (!m) return;
    var txt = '';
    try { txt = decodeURIComponent(m[1]); } catch (e) { return; }
    var p = NT.parseScore(txt);
    if (p.events.length < 6) return;
    scoreText = txt; score = p; hasScore = true;
    save('score', scoreText); refreshMenu();
    try { history.replaceState(null, '', location.href.split('#')[0]); } catch (e) { }
    toast('乐谱已导入');
  })();

  // exposed for tests
  window.__night = { startDemo: startDemo, startPlay: function () { startDemo(true); }, startListen: startListen, state: function () { return { mode: mode, P: P, Pt: Pt, inten: inten, finaleT: finaleT, lastNote: lastNote, level: level }; } };
})();
</script>
